name: Build and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_q1:
        description: 'Deploy q1 instance'
        required: true
        type: boolean
        default: false
      deploy_prod:
        description: 'Deploy to production'
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ "${{ github.actor }}" != "dependabot[bot]" ]; then
            mvn -B verify -Pcoverage org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          else
            mvn -B verify -Pcoverage
          fi


      - name: Push Docker image to GAR
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        uses: nais/docker-build-push@0e73849f69ff260ee27597553c0a7848ca4e9795
        id: docker-build-push
        with:
          team: team-oebs

  deploy-t1:
    name: Deploy t1 instance
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/app-t1.yaml
          VAR: image=${{ needs.build.outputs.image }}

  deploy-q1:
    name: Deploy q1 instance
    needs: [build, deploy-t1]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_q1 == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/app-q1.yaml
          VAR: image=${{ needs.build.outputs.image }}

  deploy-prod:
    name: Deploy to prod
    needs: [build, deploy-t1, deploy-q1]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_prod == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/app-prod.yaml
          VAR: image=${{ needs.build.outputs.image }}
